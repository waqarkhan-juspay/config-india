<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Config Pokedex</title>
<meta name="description" content="Config Pokedex: an unofficial pocket agenda for Config India 2026, Day 2 (Thu, Oct 15). Plan your day and compare plans with friends.">
<meta property="og:title" content="Config Pokedex">
<meta property="og:description" content="Config India 2026, Day 2. Plan your day and compare plans with friends.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#F1F1EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Config Pokedex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Newsreader:opsz,wght@6..72,400..700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app" id="app">
  <header class="bar" id="bar">
    <div class="bar-mark" aria-hidden="true"><i></i>Config Pokedex · Day 2</div>
    <span class="bar-title" id="barTitle" aria-hidden="true">Thu, Oct 15</span>
    <div class="bar-actions">
      <button class="icon-btn" type="button" data-act="search" aria-label="Search sessions and speakers"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.2 4.2"/></svg></button>
    </div>
  </header>

  <main id="main">
    <section class="view v-schedule" id="v-schedule" data-view="schedule" aria-label="Schedule"></section>
    <section class="view v-plan" id="v-plan" data-view="plan" aria-label="My plan" hidden></section>
    <section class="view v-speakers" id="v-speakers" data-view="speakers" aria-label="Speakers" hidden></section>
    <section class="view v-info" id="v-info" data-view="info" aria-label="Venue and info" hidden></section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button class="tab" type="button" data-tab="schedule" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.2"/><path d="M3.5 9.8h17M8 3v4M16 3v4M7.5 13.5h3M7.5 16.8h6"/></svg>Schedule</button>
    <button class="tab" type="button" data-tab="plan"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h10a1.2 1.2 0 0 1 1.2 1.2V20.6L12 16.6l-6.2 4V4.7A1.2 1.2 0 0 1 7 3.5z"/></svg>My plan<span class="tab-badge" id="planBadge" hidden>0</span></button>
    <button class="tab" type="button" data-tab="speakers"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.6"/><path d="M2.6 20c.8-3.6 3.3-5.6 6.4-5.6s5.6 2 6.4 5.6"/><path d="M15.6 5.1a3.6 3.6 0 0 1 0 6.8M17.6 14.7c1.9.7 3.2 2.4 3.8 5.3"/></svg>Speakers</button>
    <button class="tab" type="button" data-tab="info"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11.2v5"/><path d="M12 7.8v.01" stroke-width="2.4"/></svg>Info</button>
  </nav>

  <div class="scrub" id="scrub">
    <div class="scrub-full" role="group" aria-label="Time scrubber">
      <div class="scrub-top">
        <span class="scrub-state" id="scrubState"><i></i><span id="scrubStateText">Live</span></span>
        <span class="scrub-time" id="scrubTime"></span>
        <button class="scrub-live" id="scrubLive" type="button" hidden>Go live</button>
        <button class="scrub-min" id="scrubMin" type="button" aria-label="Hide the time scrubber"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg></button>
      </div>
      <div class="scrub-track" id="scrubTrack">
        <div class="scrub-lanes" id="scrubLanes" aria-hidden="true"></div>
        <div class="scrub-past" id="scrubPast" aria-hidden="true"></div>
        <input class="scrub-range" id="scrubRange" type="range" min="360" max="1260" step="5" value="360" aria-label="Preview the day at another time">
      </div>
      <div class="scrub-hours" aria-hidden="true"><span style="left:0">6 AM</span><span style="left:20%">9</span><span style="left:40%">12 PM</span><span style="left:60%">3</span><span style="left:80%">6</span><span style="left:100%">9 PM</span></div>
    </div>
    <button class="scrub-pill" id="scrubPill" type="button" aria-label="Show the time scrubber"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span id="scrubPillText">Live</span></button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-head" id="sheetHead">
      <span class="sheet-grab" aria-hidden="true"></span>
      <button class="icon-btn" type="button" id="sheetBack" aria-label="Back" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="sheet-crumb" id="sheetCrumb"></span>
      <button class="icon-btn" type="button" id="sheetClose" aria-label="Close" style="margin-left:auto"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<!-- Vercel Web Analytics: anonymous, cookie-free visitor counts. Turn it on under Project > Analytics on vercel.com.
     Locally this file doesn't exist, so the request 404s harmlessly. -->
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
